name: Publish to pub.dev

# Push a tag v<version> (the version in pubspec.yaml, e.g. v1.2.0) to publish this package. pub.dev checks the tag
# matches the version, and trusts GitHub's identity token for this repository: no token is stored here.
# It depends on winche_core through pub.dev, so release winche_core first.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # pub.dev automated publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      # Sets up the pub.dev credentials from GitHub's identity token.
      - uses: dart-lang/setup-dart@v1
      # A Flutter package is published with Flutter's own pub.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter pub publish --force
